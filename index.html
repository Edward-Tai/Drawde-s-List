<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卓德管理助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              studio: {
                900: 'rgb(var(--studio-900) / <alpha-value>)', // Main Background
                800: 'rgb(var(--studio-800) / <alpha-value>)', // Card Background
                700: 'rgb(var(--studio-700) / <alpha-value>)', // Borders
                600: 'rgb(var(--studio-600) / <alpha-value>)', // Inputs / Lighter borders
                500: '#64748b',
                accent: 'rgb(var(--studio-accent) / <alpha-value>)', // Cyan / Primary
                secondary: '#8b5cf6', // Violet
                danger: '#ef4444',
                success: '#10b981',
                fg: 'rgb(var(--studio-fg) / <alpha-value>)', // Main Text (Adaptive)
                muted: 'rgb(var(--studio-muted) / <alpha-value>)' // Muted Text (Adaptive)
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Define RGB values for variables to allow Tailwind opacity modifiers (e.g., bg-studio-900/50) */
      :root {
        /* Dark Mode (Default) */
        --studio-900: 15 23 42;   /* #0f172a */
        --studio-800: 30 41 59;   /* #1e293b */
        --studio-700: 51 65 85;   /* #334155 */
        --studio-600: 71 85 105;  /* #475569 */
        --studio-accent: 6 182 212; /* #06b6d4 */
        
        --studio-fg: 248 250 252; /* #f8fafc (text-slate-50) */
        --studio-muted: 148 163 184; /* #94a3b8 (text-slate-400) */
      }

      /* Light Mode Overrides */
      .light-mode {
        --studio-900: 241 245 249; /* #f1f5f9 (Slate 100) - Main Background */
        --studio-800: 255 255 255; /* #ffffff - Card Background */
        --studio-700: 203 213 225; /* #cbd5e1 (Slate 300) - Borders */
        --studio-600: 148 163 184; /* #94a3b8 (Slate 400) - Inputs/Strong Borders */
        --studio-accent: 8 145 178;  /* #0891b2 (Cyan 600) - Darker for contrast on white */

        --studio-fg: 15 23 42;    /* #0f172a (Slate 900) - Main Text */
        --studio-muted: 71 85 105; /* #475569 (Slate 600) - Muted Text */
      }

      body {
        background-color: rgb(var(--studio-900));
        color: rgb(var(--studio-fg));
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgb(var(--studio-700)); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--studio-600)); 
      }

      /* Hide Date/Time Picker Indicators for Cleaner Look */
      input::-webkit-calendar-picker-indicator {
        display: none !important;
        -webkit-appearance: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
